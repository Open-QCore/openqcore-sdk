[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "openqcore"
dynamic = ["version"]
description = "Official Python SDK for the OpenQCore API: chat, voice, Iris (images, video, OCR), knowledge and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "OpenQCore", email = "developers@openqcore.com" }]
keywords = ["openqcore", "ai", "llm", "chat", "voice", "rag", "ocr", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "mypy>=1.8", "ruff>=0.5"]

[project.urls]
Homepage = "https://www.openqcore.com/developers/sdks"
Documentation = "https://www.openqcore.com/docs"
Source = "https://github.com/Open-QCore/openqcore-sdk"
Issues = "https://github.com/Open-QCore/openqcore-sdk/issues"

[tool.hatch.version]
path = "src/openqcore/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openqcore"]

[tool.hatch.build.targets.sdist]
include = ["src/openqcore", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = false
